[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "focuslens-ai"
version = "0.1.0"
description = "FocusLens webcam focus measurement client"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.28,<1",
  "mediapipe==0.10.21",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
focuslens-ai = "focuslens_ai.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
