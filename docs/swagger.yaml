openapi: 3.0.3
info:
  title: FocusLens API
  description: |
    FocusLens 백엔드 Phase 3 MVP REST API.
    기준 문서: `docs/api-spec.md`
    공통 응답: `{ success, data, error }`
  version: 1.0.0
  license:
    name: Project repository terms
    url: https://github.com/hwang-sungjo/focusLens

servers:
  - url: /
    description: 현재 호스트

tags:
  - name: auth
    description: 인증 (register, login, logout)
  - name: sessions
    description: 학습 세션 및 집중도 로그
  - name: reports
    description: 집중도 리포트
  - name: users
    description: 사용자 프로필 및 프라이버시
  - name: connections
    description: 친구 연결
  - name: session-shares
    description: 세션 공유 및 공감 반응
  - name: rankings
    description: 집중도·학습 시간 랭킹
  - name: groups
    description: 그룹, 목표, 관리자 피드백

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token (만료 1시간). Authorization Bearer header.

  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    SessionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, CANCELLED]

    AttentionState:
      type: string
      enum: [FOCUSED, NORMAL, DISTRACTED]

    ShareScope:
      type: string
      enum: [PUBLIC, FRIENDS, GROUP]

    SessionScope:
      type: string
      enum: [PUBLIC, FRIENDS, GROUP, PRIVATE]

    ConnectionRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]

    ReactionType:
      type: string
      enum: [LIKE, CHEER, EMPATHY]

    GroupType:
      type: string
      enum: [STUDY, PROJECT, CHALLENGE]

    GroupVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]

    GroupRole:
      type: string
      enum: [OWNER, MANAGER, MEMBER]

    GoalStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED]

  responses:
    Response400:
      description: Bad Request — 유효성 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            data: {}
            error: 요청 형식이 올바르지 않습니다
    Response401:
      description: Unauthorized — 인증 토큰 없음·만료·무효
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            data: {}
            error: 인증 토큰이 필요합니다
    Response403:
      description: Forbidden — 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            data: {}
            error: 해당 리소스에 대한 권한이 없습니다
    Response404:
      description: Not Found — 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            data: {}
            error: 리소스를 찾을 수 없습니다

paths:
  # ---------------------------------------------------------------------------
  # auth
  # ---------------------------------------------------------------------------
  /api/auth/register:
    post:
      tags: [auth]
      summary: 회원가입
      description: 가입 시 user_profiles, user_privacy_settings 기본값 자동 생성
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, nickname]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                nickname:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          name:
                            type: string
                          access_token:
                            type: string
                          expires_in:
                            type: integer
                            example: 3600
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: JWT access token 발급 (만료 1시간)
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          access_token:
                            type: string
                          expires_in:
                            type: integer
                            example: 3600
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      description: Redis 블랙리스트에 토큰 등록하여 무효화
      operationId: authLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: 로그아웃되었습니다
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  # ---------------------------------------------------------------------------
  # sessions
  # ---------------------------------------------------------------------------
  /api/sessions/start:
    post:
      tags: [sessions]
      summary: 세션 시작
      description: user_id는 JWT sub에서 추출
      operationId: sessionsStart
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session_id:
                            type: string
                            format: uuid
                          started_at:
                            type: string
                            format: date-time
                          status:
                            $ref: '#/components/schemas/SessionStatus'
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/sessions:
    get:
      tags: [sessions]
      summary: 내 세션 목록 조회
      description: 최신순 정렬
      operationId: sessionsList
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions:
                            type: array
                            items:
                              type: object
                              properties:
                                session_id:
                                  type: string
                                  format: uuid
                                started_at:
                                  type: string
                                  format: date-time
                                ended_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                status:
                                  $ref: '#/components/schemas/SessionStatus'
                                avg_focus_score:
                                  type: number
                                  format: float
                                duration_seconds:
                                  type: integer
                          pagination:
                            $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/sessions/{id}:
    get:
      tags: [sessions]
      summary: 세션 상세 조회
      description: 분 단위 집중도 타임라인 포함
      operationId: sessionsGetById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session_id:
                            type: string
                            format: uuid
                          started_at:
                            type: string
                            format: date-time
                          ended_at:
                            type: string
                            format: date-time
                            nullable: true
                          status:
                            $ref: '#/components/schemas/SessionStatus'
                          avg_focus_score:
                            type: number
                            format: float
                          duration_seconds:
                            type: integer
                          timeline:
                            type: array
                            items:
                              type: object
                              properties:
                                logged_at:
                                  type: string
                                  format: date-time
                                gaze_score:
                                  type: number
                                blink_score:
                                  type: number
                                head_score:
                                  type: number
                                focus_score:
                                  type: number
                                attention_state:
                                  $ref: '#/components/schemas/AttentionState'
                                face_detected:
                                  type: boolean
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/sessions/{id}/log:
    post:
      tags: [sessions]
      summary: 집중도 로그 저장
      description: |
        분 단위 로그. gaze/blink/head/total 0~100 검증.
        UNIQUE(session_id, logged_at) 중복 차단.
      operationId: sessionsLog
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gaze, blink, head, total]
              properties:
                gaze:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 100
                blink:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 100
                head:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 100
                total:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          log_id:
                            type: string
                            format: uuid
                          logged_at:
                            type: string
                            format: date-time
                          focus_score:
                            type: number
                          attention_state:
                            $ref: '#/components/schemas/AttentionState'
                          face_detected:
                            type: boolean
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/sessions/{id}/end:
    post:
      tags: [sessions]
      summary: 세션 종료
      description: 리포트 자동 생성
      operationId: sessionsEnd
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session_id:
                            type: string
                            format: uuid
                          report_id:
                            type: string
                            format: uuid
                          ended_at:
                            type: string
                            format: date-time
                          status:
                            $ref: '#/components/schemas/SessionStatus'
                          summary:
                            type: object
                            properties:
                              avg_focus_score:
                                type: number
                              duration_seconds:
                                type: integer
                              gaze_avg:
                                type: number
                              blink_avg:
                                type: number
                              head_avg:
                                type: number
                              focused_minutes:
                                type: integer
                              distracted_minutes:
                                type: integer
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  # ---------------------------------------------------------------------------
  # reports
  # ---------------------------------------------------------------------------
  /api/reports/weekly:
    get:
      tags: [reports]
      summary: 주간 집중도 요약
      description: 최근 7일 일별 평균 집중도
      operationId: reportsWeekly
      security:
        - BearerAuth: []
      parameters:
        - name: end_date
          in: query
          description: 기준 종료일 (ISO 8601 date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date:
                                type: string
                                format: date
                              end_date:
                                type: string
                                format: date
                          daily_summaries:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date
                                session_count:
                                  type: integer
                                total_study_seconds:
                                  type: integer
                                avg_focus_score:
                                  type: number
                          weekly_avg_focus_score:
                            type: number
                          weekly_total_study_seconds:
                            type: integer
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/reports/monthly:
    get:
      tags: [reports]
      summary: 월간 집중도 요약
      description: 완료된 세션만 대상으로 최근 30일 일별 집중도와 학습 시간을 집계
      operationId: reportsMonthly
      security:
        - BearerAuth: []
      parameters:
        - name: end_date
          in: query
          description: 기준 종료일 (ISO 8601 date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date:
                                type: string
                                format: date
                              end_date:
                                type: string
                                format: date
                          daily_summaries:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date
                                session_count:
                                  type: integer
                                total_study_seconds:
                                  type: integer
                                avg_focus_score:
                                  type: number
                                  nullable: true
                          monthly_avg_focus_score:
                            type: number
                            nullable: true
                          monthly_total_study_seconds:
                            type: integer
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'

  /api/reports/{session_id}:
    get:
      tags: [reports]
      summary: 세션별 리포트 조회
      operationId: reportsGetBySessionId
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          report_id:
                            type: string
                            format: uuid
                          session_id:
                            type: string
                            format: uuid
                          summary_json:
                            type: object
                          timeline:
                            type: array
                            items:
                              type: object
                          created_at:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  # ---------------------------------------------------------------------------
  # users (ERD user_profiles, user_privacy_settings — register 시 자동 생성)
  # ---------------------------------------------------------------------------
  /api/users/{id}/profile:
    get:
      tags: [users]
      summary: 공개 프로필 조회
      operationId: usersGetProfile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          nickname:
                            type: string
                          profile_image_url:
                            type: string
                            nullable: true
                          bio:
                            type: string
                            nullable: true
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/users/me/profile:
    patch:
      tags: [users]
      summary: 내 프로필 수정
      operationId: usersUpdateMyProfile
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                profile_image_url:
                  type: string
                  nullable: true
                bio:
                  type: string
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'

  /api/users/me/privacy:
    get:
      tags: [users]
      summary: 프라이버시 설정 조회
      operationId: usersGetMyPrivacy
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          default_session_scope:
                            $ref: '#/components/schemas/SessionScope'
                          score_visibility:
                            $ref: '#/components/schemas/SessionScope'
                          study_time_visibility:
                            $ref: '#/components/schemas/SessionScope'
                          group_data_sharing:
                            type: boolean
                          ranking_participation:
                            type: boolean
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
          $ref: '#/components/responses/Response404'
    patch:
      tags: [users]
      summary: 프라이버시 설정 수정
      operationId: usersUpdateMyPrivacy
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                default_session_scope:
                  $ref: '#/components/schemas/SessionScope'
                score_visibility:
                  $ref: '#/components/schemas/SessionScope'
                study_time_visibility:
                  $ref: '#/components/schemas/SessionScope'
                group_data_sharing:
                  type: boolean
                ranking_participation:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/Response400'
        '401':
          $ref: '#/components/responses/Response401'
        '403':
          $ref: '#/components/responses/Response403'
        '404':
