# ── 공통 환경변수 앵커 ─────────────────────────────────────────────
x-db-credentials: &db-credentials
  POSTGRES_DB: focuslens
  POSTGRES_USER: focuslens
  POSTGRES_PASSWORD: focuslens_pw

services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *db-credentials
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuslens -d focuslens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apply only committed migrations and Views before starting the API.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://focuslens:focuslens_pw@postgres:5432/focuslens?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend (Node.js + Express) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ${LOCAL_ENV_FILE:-./backend/.env}
    environment:
      NODE_ENV: development
      PORT: "3000"
      CORS_ORIGIN: ${LOCAL_CORS_ORIGIN:-http://localhost:5173}
      REFRESH_COOKIE_DOMAIN: ""
      REFRESH_COOKIE_SAME_SITE: lax
      ROLLUP_ENABLED: ${LOCAL_ROLLUP_ENABLED:-false}
      # Docker 내부 서비스명으로 HOST 덮어쓰기
      DATABASE_URL: "postgresql://focuslens:focuslens_pw@postgres:5432/focuslens?schema=public"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

# ── Named Volumes (데이터 영속성 보장) ────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
